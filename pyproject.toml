[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "Modular evaluation of open-source models and AI pipelines on a client's own data"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
include = ["evalkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
