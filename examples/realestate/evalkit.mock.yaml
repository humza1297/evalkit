# Offline demo. The mock provider exercises the whole pipeline without any model installed.
# The resulting ranking is NOT a real model comparison.
project: harbor-point-realty (mock demo)
confidential: true          # only local providers allowed (mock counts as local)
corpus: ./docs
dataset: ./eval.jsonl
pack: rag                   # default system prompt + scorers for RAG
judge: mock/judge
generator: {model: mock/generator, n: 10, business: "a small real-estate brokerage", persona: "a home seller or buyer"}

providers:
  mock:
    pricing:                # USD per 1M tokens [input, output], so the cost column has something to show
      extractive: [0.10, 0.40]
      extractive-large: [0.60, 2.40]

targets:
  - {name: bm25-small,   type: rag, model: mock/extractive,       retriever: bm25,      top_k: 3}
  - {name: hybrid-large, type: rag, model: mock/extractive-large, retriever: hybrid,    embedder: mock/hash, top_k: 4}
  - {name: embed-small,  type: rag, model: mock/extractive,       retriever: embedding, embedder: mock/hash, top_k: 2, chunk_size: 400}
  - {name: always-refuses, type: rag, model: mock/lazy}

weights: {quality: 0.7, latency: 0.15, cost: 0.15}
budgets: {latency_s: 1.0, cost_per_1k: 0.05}
